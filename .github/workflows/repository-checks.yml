name: Repository checks

on:
  pull_request:
  push:
    branches:
      - 'dot/**'

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1 verified 2026-10-10; pin actual content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline repository checks (no models or native engines)
        run: python3 scripts/check_offline.py
